{{- /*
Ingress -> internet-facing ALB (created by the AWS Load Balancer Controller).
Wrapped in a conditional so setting ingress.enabled=false skips the ALB
entirely (e.g. to test via kubectl port-forward with no public exposure).

TLS: when tls.enabled=true, the ALB gets an HTTPS:443 listener using the ACM
cert in tls.certArn, and (if tls.redirectHttp) port 80 redirects to 443.
*/ -}}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mealie
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: {{ .Values.ingress.healthcheckPath | quote }}
    {{- if .Values.ingress.groupName }}
    alb.ingress.kubernetes.io/group.name: {{ .Values.ingress.groupName | quote }}
    {{- end }}
    {{- if .Values.tls.enabled }}
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/certificate-arn: {{ .Values.tls.certArn | quote }}
    {{- if .Values.tls.redirectHttp }}
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    {{- end }}
    {{- else }}
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    {{- end }}
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mealie
                port:
                  number: 80
      {{- if .Values.ingress.host }}
      host: {{ .Values.ingress.host | quote }}
      {{- end }}
{{- end }}
