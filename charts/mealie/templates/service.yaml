# ClusterIP Service: stable in-cluster address; the Ingress/ALB and
# port-forward both target this. port 80 -> pod's named "http" port (9000).
apiVersion: v1
kind: Service
metadata:
  name: mealie
  labels:
    app: mealie
spec:
  type: ClusterIP
  selector:
    app: mealie
  ports:
    - name: http
      port: 80
      targetPort: http
