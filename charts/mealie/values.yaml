# Default configuration for the Mealie chart. Override any of these at install
# time with --set key=value, or with a custom -f myvalues.yaml.

image:
  repository: ghcr.io/mealie-recipes/mealie
  tag: v3.26.0
  pullPolicy: IfNotPresent

# Number of replicas. Keep at 1: Mealie/SQLite uses a single ReadWriteOnce
# volume that cannot be shared across pods.
replicas: 1

# The external URL users hit. Set this to your custom domain (host-based
# routing). Used by Mealie to generate absolute links (emails, redirects).
baseUrl: "https://mealie.lookuplandinghyrule.fyi"

# Application environment.
env:
  allowSignup: "false"
  puid: "1000"
  pgid: "1000"
  tz: "Europe/Dublin"

# Persistent storage for /app/data (SQLite DB + uploads).
storage:
  className: gp3
  size: 2Gi

# Container resources. A memory limit is recommended (Python over-allocates).
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1000Mi

# Ingress / ALB. Set enabled=false to skip the public ALB and test via
# `kubectl port-forward` instead.
ingress:
  enabled: true
  # Hostname for host-based routing. The ALB routes requests whose Host header
  # matches this to Mealie. Required when sharing an ALB via group.name.
  host: "mealie.lookuplandinghyrule.fyi"
  # group.name merges this Ingress with others of the same group onto ONE
  # shared ALB. Leave empty for a dedicated ALB.
  groupName: "shared"
  healthcheckPath: /api/app/about

# TLS on the ALB. When enabled, the ALB gets an HTTPS:443 listener using the
# ACM certificate referenced by certArn. certArn is account-specific, so it's
# left empty here and supplied at deploy time (e.g. --set tls.certArn=...).
tls:
  enabled: false
  certArn: ""
  # redirectHttp: when true, port 80 issues a 301 redirect to 443.
  redirectHttp: true
