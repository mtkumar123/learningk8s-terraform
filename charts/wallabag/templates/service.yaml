# ClusterIP Service: stable in-cluster address; the Ingress/ALB and
# port-forward both target this. port 80 -> pod's named "http" port (80).
apiVersion: v1
kind: Service
metadata:
  name: wallabag
  labels:
    app: wallabag
spec:
  type: ClusterIP
  selector:
    app: wallabag
  ports:
    - name: http
      port: 80
      targetPort: http
