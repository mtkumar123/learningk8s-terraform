# ClusterIP Service: stable in-cluster address for the Mealie pods.
#
# ClusterIP is internal-only (not reachable from your laptop directly). We use
# it first to verify the app via `kubectl port-forward`. Later we add a
# separate LoadBalancer Service for external access.
#
# port 80 -> targetPort 9000: clients hit the Service on 80, which forwards to
# the container's 9000.
apiVersion: v1
kind: Service
metadata:
  name: mealie
  namespace: mealie
  labels:
    app: mealie
spec:
  type: ClusterIP
  selector:
    app: mealie
  ports:
    - name: http
      port: 80
      targetPort: http
