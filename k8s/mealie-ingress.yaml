# Ingress -> provisions a public (internet-facing) ALB routing to the Mealie
# Service. The AWS Load Balancer Controller watches this object and creates the
# ALB, target group, and listener in AWS.
#
# HTTP-only for now (port 80). TLS/HTTPS via ACM will be added later.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mealie
  namespace: mealie
  annotations:
    # Use an ALB (Application Load Balancer) for this Ingress.
    alb.ingress.kubernetes.io/scheme: internet-facing
    # target-type "ip" -> ALB sends traffic directly to pod IPs (via the VPC
    # CNI), not through a NodePort. This is the modern default and works
    # because your pods have real VPC IPs.
    alb.ingress.kubernetes.io/target-type: ip
    # Listen on HTTP:80 (we'll add 443 + ACM cert for TLS later).
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    # Health check the app's status endpoint so the ALB only routes to ready pods.
    alb.ingress.kubernetes.io/healthcheck-path: /api/app/about
spec:
  # Tells Kubernetes this Ingress is handled by the AWS LB Controller's class.
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mealie
                port:
                  number: 80
