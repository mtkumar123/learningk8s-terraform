apiVersion: v1
kind: PersistentVolume
metadata:
  name: wallabag-pv
  labels:
    app: wallabag
spec:
  capacity:
    storage: 500Mi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /mnt/disks/wallabag
    type: DirectoryOrCreate
